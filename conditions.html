<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conditions · New England Ski Guide</title>
<meta name="description" content="Seven-day snowfall forecast and current summit conditions for every New England ski area, ranked by who is about to get hit.">

<!-- Icons. The .ico is listed first and the SVG second on purpose: a browser that
     understands SVG icons prefers the later, higher-fidelity declaration, and one
     that does not falls back to the .ico rather than showing nothing. Everything
     here is generated from assets/favicon.svg by tools/build-icons.mjs.
     All paths are relative so the site still works deployed under a subpath. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Ski Guide">
<meta name="theme-color" content="#0e5b9e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">

<!-- Open Graph. og:url, rel=canonical and the absolute form of og:image are all
     set at runtime by assets/js/seo.js: this repo has no domain baked into it
     anywhere, and a URL pointing at the wrong host is worse than no URL at all.
     The og:image below is a relative path, which Facebook and Twitter both
     resolve against the page URL; seo.js rewrites it to an absolute URL as well,
     for the scrapers that insist. The card carries no photography — it is the
     site mark and two lines of type, generated by tools/build-icons.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="New England Ski Guide">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Conditions · New England Ski Guide">
<meta property="og:description" content="Seven-day snowfall forecast and current summit conditions for every New England ski area, ranked by who is about to get hit.">
<meta property="og:image" content="assets/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="New England Ski Guide — every mountain worth the drive">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/og-card.png">
<meta name="twitter:title" content="Conditions · New England Ski Guide">
<meta name="twitter:description" content="Seven-day snowfall forecast and current summit conditions for every New England ski area, ranked by who is about to get hit.">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<main id="main">
  <div class="toolbar" id="toolbar">
    <div class="toolbar__row">
      <div class="search-inline">
        <span class="si-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
        <input class="si-input" type="search" id="search" placeholder="Filter mountains…"
               aria-label="Filter by resort or town name" autocomplete="off">
      </div>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <div class="chips chips--tags" id="filter-state" role="group" aria-label="State"></div>
      <div class="toolbar-right">
        <span class="result-count" id="result-count">&nbsp;</span>
        <label class="sort-label" for="sort-by">Sort
          <select id="sort-by">
            <option value="snow7d" selected>7-day snowfall</option>
            <option value="snow24h">Next 24 hours</option>
            <option value="temp">Temperature</option>
            <option value="wind">Wind</option>
            <option value="name">Name</option>
            <option value="verticalDrop">Vertical drop</option>
          </select>
        </label>
        <button type="button" class="sort-dir" id="sort-dir" aria-label="Sort direction: high to low" data-dir="desc">↓</button>
      </div>
    </div>
  </div>

  <div class="view" id="view">
    <!-- Two shapes of the same rows. Which one shows is decided by a media query
         in the stylesheet — the thirteen-column table above 900px, the stacked
         list below it — and both are always rendered, so nothing has to run
         after first paint to correct the choice. -->
    <div class="table-wrap" id="conditions-table-wrap">
      <table class="data-table" id="conditions-table">
        <caption class="visually-hidden">
          Current summit conditions and the seven-day snowfall forecast for every ski area.
        </caption>
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <ul class="wx-list" id="conditions-list"></ul>

    <p class="note" id="failure-note" hidden></p>
    <p id="status" role="status">Loading resorts…</p>
  </div>
</main>

<script type="module" src="assets/js/render-conditions.js"></script>
</body>
</html>
