<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map · New England Ski Guide</title>
<meta name="description" content="Every New England ski area on one map, pinned at the lift-served summit and coloured by which pass gets you on the lift.">

<!-- Leaflet is the only third-party script on this site and it loads only on this
     page. Pinned to an exact version with subresource integrity so a compromised
     CDN cannot silently change what runs here. -->
<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
      referrerpolicy="no-referrer">

<!-- Icons. The .ico is listed first and the SVG second on purpose: a browser that
     understands SVG icons prefers the later, higher-fidelity declaration, and one
     that does not falls back to the .ico rather than showing nothing. Everything
     here is generated from assets/favicon.svg by tools/build-icons.mjs.
     All paths are relative so the site still works deployed under a subpath. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Ski Guide">
<meta name="theme-color" content="#0e5b9e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">

<!-- Open Graph. og:url, rel=canonical and the absolute form of og:image are all
     set at runtime by assets/js/seo.js: this repo has no domain baked into it
     anywhere, and a URL pointing at the wrong host is worse than no URL at all.
     The og:image below is a relative path, which Facebook and Twitter both
     resolve against the page URL; seo.js rewrites it to an absolute URL as well,
     for the scrapers that insist. The card carries no photography — it is the
     site mark and two lines of type, generated by tools/build-icons.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="New England Ski Guide">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Map · New England Ski Guide">
<meta property="og:description" content="Every New England ski area on one map, pinned at the lift-served summit and coloured by which pass gets you on the lift.">
<meta property="og:image" content="assets/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="New England Ski Guide — every mountain worth the drive">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/og-card.png">
<meta name="twitter:title" content="Map · New England Ski Guide">
<meta name="twitter:description" content="Every New England ski area on one map, pinned at the lift-served summit and coloured by which pass gets you on the lift.">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<main id="main">
  <div class="toolbar" id="toolbar">
    <div class="toolbar__row">
      <span class="label" id="legend-label">Pass</span>
      <div class="chips chips--tags" id="map-legend" role="group" aria-labelledby="legend-label"></div>
      <div class="toolbar-right">
        <span class="result-count" id="result-count">&nbsp;</span>
      </div>
    </div>
  </div>

  <div class="view" id="view">
    <div class="map-split">
      <div class="map-split__map">
        <div id="map" class="map-canvas" role="application"
             aria-label="Map of New England ski areas. An equivalent list of every mountain is beside it."></div>
        <p class="note" id="map-note" hidden></p>
      </div>

      <!-- The right column is the accessible equivalent of the map, not a second
           navigation. Every entry is a real link to the detail page; the button
           beside it only moves the map.

           A div, not an aside: the <section> inside already carries the landmark
           and its accessible name, and a second unlabelled complementary landmark
           collides with the shell's sidebar. -->
      <div class="map-split__list">
        <section class="map-list" aria-labelledby="map-list-head">
          <h2 id="map-list-head">Every mountain on the map</h2>
          <p class="note">
            The same forty-five areas as plain links, grouped by state — for keyboard users,
            for screen readers, and for anything that cannot run the map. Hover or focus a
            name to find it on the map.
          </p>
          <div id="map-list"></div>
        </section>
      </div>
    </div>

    <p id="status" role="status">Loading the map…</p>
  </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
<script type="module" src="assets/js/render-map.js"></script>
</body>
</html>
