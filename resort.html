<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resort · New England Ski Guide</title>
<meta name="description" content="Stats, passes, pricing and an honest opinion for a New England ski area.">

<!-- Icons. The .ico is listed first and the SVG second on purpose: a browser that
     understands SVG icons prefers the later, higher-fidelity declaration, and one
     that does not falls back to the .ico rather than showing nothing. Everything
     here is generated from assets/favicon.svg by tools/build-icons.mjs.
     All paths are relative so the site still works deployed under a subpath. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="apple-mobile-web-app-title" content="Ski Guide">
<meta name="theme-color" content="#0e5b9e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">

<!-- Open Graph. og:url, rel=canonical and the absolute form of og:image are all
     set at runtime by assets/js/seo.js: this repo has no domain baked into it
     anywhere, and a URL pointing at the wrong host is worse than no URL at all.
     The og:image below is a relative path, which Facebook and Twitter both
     resolve against the page URL; seo.js rewrites it to an absolute URL as well,
     for the scrapers that insist. The card carries no photography — it is the
     site mark and two lines of type, generated by tools/build-icons.mjs. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="New England Ski Guide">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Resort · New England Ski Guide">
<meta property="og:description" content="Stats, passes, pricing and an honest opinion for a New England ski area.">
<meta property="og:image" content="assets/og-card.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="New England Ski Guide — every mountain worth the drive">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="assets/og-card.png">
<meta name="twitter:title" content="Resort · New England Ski Guide">
<meta name="twitter:description" content="Stats, passes, pricing and an honest opinion for a New England ski area.">
<!-- Whether the support card at the foot of this page has been dismissed. This
     is the same pattern index.html uses for the view preference, and it is here
     for the same reason: the flag is read before the stylesheet paints and
     written onto <html>, where a rule in site.css hides the card outright. The
     alternative - letting the card paint and then removing it from a module -
     takes a 200px block out of the page after first paint and shifts everything
     under it, which is precisely the layout shift this site spent two sessions
     getting rid of.

     One script, not two: anything else this page needs to know before paint
     belongs in this block rather than in a second one.

     localStorage throws in a private window and when site data is blocked. The
     catch leaves the attribute unset and the card shows, which is the correct
     fallback in both directions - a visitor who has never made a choice sees it,
     and a visitor whose choice could not be stored sees it again. -->
<script>
  (function () {
    try {
      if (localStorage.getItem('ne-ski-support') === 'dismissed') {
        document.documentElement.setAttribute('data-support', 'dismissed');
      }
    } catch (e) { /* nothing stored, or storage refused: the card shows */ }
  })();
</script>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>

<main id="main">
  <div class="view" id="view">
    <article id="resort" hidden></article>
    <p id="status" role="status">Loading resort…</p>
  </div>
</main>

<script type="module" src="assets/js/render-resort.js"></script>
</body>
</html>
